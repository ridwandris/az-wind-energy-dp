bundle:
  name: az_wind_energy_dp

resources:
  jobs:
    ingest_kelmarsh_zenodo_job:
      name: "01_ingest_kelmarsh_zenodo_to_adls"
      tasks:
        - task_key: download_and_extract_zenodo
          spark_python_task:
            python_file: data_pipeline/kelmarsh_data_ingestion.py
            parameters:
              - "ALL"
          environment_key: default_serverless_env

      environments:
        - environment_key: default_serverless_env
          spec:
            client: "1"
            dependencies:
              - requests

    bronze_ingestion_job:
      name: "02_bronze_autoloader_ingestion"
      tasks:
        - task_key: autoloader_to_bronze_delta
          spark_python_task:
            python_file: databricks/bronze_ingestion.py
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            client: "1"

    silver_transformation_job:
      name: "03_silver_transformation"
      tasks:
        - task_key: bronze_to_silver_delta
          spark_python_task:
            python_file: databricks/silver_transformation.py
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            client: "1"

    gold_aggregation_job:
      name: "04_gold_kpi_aggregations"
      tasks:
        - task_key: silver_to_gold_delta
          spark_python_task:
            python_file: databricks/gold_aggregations.py
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            client: "1"

    ml_digital_twin_job:
      name: "06_ml_power_digital_twin"
      tasks:
        - task_key: train_and_score_digital_twin
          spark_python_task:
            python_file: databricks/ml_power_prediction.py
          environment_key: ml_serverless_env

      environments:
        - environment_key: ml_serverless_env
          spec:
            client: "1"
            dependencies:
              - scikit-learn
              - mlflow
              - pandas
              - numpy

    medallion_end_to_end_pipeline:
      name: "05_kelmarsh_medallion_orchestrator"
      tasks:
        - task_key: bronze_autoloader
          spark_python_task:
            python_file: databricks/bronze_ingestion.py
          environment_key: serverless_env

        - task_key: silver_cleaning
          depends_on:
            - task_key: bronze_autoloader
          spark_python_task:
            python_file: databricks/silver_transformation.py
          environment_key: serverless_env

        - task_key: gold_kpis
          depends_on:
            - task_key: silver_cleaning
          spark_python_task:
            python_file: databricks/gold_aggregations.py
          environment_key: serverless_env

        - task_key: ml_digital_twin
          depends_on:
            - task_key: gold_kpis
          spark_python_task:
            python_file: databricks/ml_power_prediction.py
          environment_key: ml_serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            client: "1"
        - environment_key: ml_serverless_env
          spec:
            client: "1"
            dependencies:
              - scikit-learn
              - mlflow
              - pandas
              - numpy

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}